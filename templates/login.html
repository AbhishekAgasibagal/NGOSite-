<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGO Admin Access</title>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 2px solid #eee; }
        .tab-btn { padding: 10px; cursor: pointer; font-weight: 600; color: #888; }
        .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .flash-msg { padding: 10px; margin-bottom: 15px; border-radius: 6px; text-align: center; font-size: 0.9rem; color: white; }
        input { display: block; width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-msg" style="background: {{ '#28a745' if category == 'success' else '#dc3545' }};">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="tabs">
            <div id="login-tab" class="tab-btn active" onclick="showForm('login')">Login</div>
            <div id="register-tab" class="tab-btn" onclick="showForm('register')">Register</div>
        </div>

        <div id="login-form">
            <form action="/login" method="POST">
                <input type="text" name="user" placeholder="Username" required>
                <input type="password" name="pass" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="register-form" class="hidden">
            <form action="/register" method="POST">
                <input type="text" name="new_user" placeholder="New Username" required>
                <input type="password" name="new_pass" placeholder="New Password" required>
                <input type="password" name="confirm_pass" placeholder="Confirm Password" required>
                <button type="submit" style="background: #28a745;">Register Now</button>
            </form>
        </div>
    </div>

    <script>
        function showForm(type) {
            document.getElementById('login-form').classList.toggle('hidden', type === 'register');
            document.getElementById('register-form').classList.toggle('hidden', type === 'login');
            document.getElementById('login-tab').classList.toggle('active', type === 'login');
            document.getElementById('register-tab').classList.toggle('active', type === 'register');
        }
    </script>
</body>
</html>
