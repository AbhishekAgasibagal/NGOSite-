<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RISE NGO | Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="main-header">
        <a href="/home" class="logo-text">RISE</a>
        <nav>
            <ul class="nav-links">
                <li><a href="/home">Home</a></li>
                <li><a href="/about">About Us</a></li>
                <li><a href="/projects">Our Projects</a></li>
                <li><a href="/media">Media</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <section class="home-hero">
        <img src="{{ url_for('static', filename='images/ngo.jpg') }}" class="hero-img">
        <div class="hero-overlay">
            <h1>{{ content.banner_title }}</h1>
            <p>Join us in our journey to provide education and healthcare.</p>
        </div>
    </section>

    <div class="cta-container">
        <div class="button-grid">
            <a href="/about" class="action-card">
                <h3>Our Mission</h3>
                <p>{{ content.mission }}</p>
            </a>
            <a href="/about" class="action-card">
                <h3>Our Vision</h3>
                <p>{{ content.vision }}</p>
            </a>
            <a href="/about" class="action-card" style="border-bottom-color: #2d5a27;">
                <h3>Donate</h3>
                <p>Support the cause.</p>
            </a>
        </div>
    </div>

</body>
</html>
